name: Loctax
description: 'Loctax is a collaborative tax compliance, risk, and governance platform built for global
  in-house tax teams. Founded in 2020 and based in Gent, Belgium, its Global Tax Intelligence Platform
  lets teams ask any tax question grounded in their own company data and IBFD''s authoritative tax content
  spanning 220+ jurisdictions, then act on the answer with workflow, compliance-monitoring, risk, and
  controversy-management tooling. Loctax is backed by Index Ventures, Cavalry Ventures, and Seedcamp,
  and in 2026 was acquired by Tax Systems to build a combined EMEA tax-technology platform. Loctax is a
  closed enterprise SaaS product with no public developer API, portal, or specification at the time of
  this profile.'
